<mat-card class="product-card" matRipple class="product-card" [matRippleColor]="'rgba(189, 189, 189, 0.30)'">
  <img
    class="product-image"
    [src]="product().image"
  />

  <div class="product-details">
    <mat-card-header>
      <mat-card-title>{{ product().name }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- if this is not 0 or null -> via interface ? optional property -->
      @if (product().originalPrice) {
        <span class="sale-badge">On Sale</span>
        <p class="price-row">
          <span class="current-price">{{ product().price}}</span>
          <span class="original-price">{{ product().originalPrice}}</span>
        </p>
      } @else {
        <span class="current-price">{{ product().price}} </span>
      }
      <p>{{ product().description }}</p>
    </mat-card-content>

    <mat-card-actions class="cartButton-actions">
      <button matButton class="addToCart-button"  (click)="onAddToCard()"> {{ addButtonLabel() }} </button>
      <button matButton class="deleteFromCart-button" (click)="onDeleteFromCart()"> {{ deleteButtonLabel() }} </button>
    </mat-card-actions>
  </div>

</mat-card>
