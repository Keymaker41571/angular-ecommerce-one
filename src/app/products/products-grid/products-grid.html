 <div class="products-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label >Search Products</mat-label>
    <!-- [()] does event and property binding at once,
     ngModel will bind the input to the component state,
     angular 17 onwards you template binding understands
     writable signals "searchTerm"-->
    <input [(ngModel)]="searchTerm" matInput placeholder="e.g. headphones">
  </mat-form-field>

  <!--
  <p class="search-preview">
    Search Term: {{ searchTerm() }}
  </p> -->

  <div class="products-grid">
    @for (product of filterdProducts(); track product.id) {
      <!-- <app-product-card [product]="product"> → passes that individual
      product to the ProductCard child through its input()-->
      <app-product-card
        [product]="product"
        (addToCart)="onAddToCart($event)"
        (deleteFromCart)="onDeleteFromCart($event)">
      </app-product-card>
    } @empty {
      <div class="empty-state">
        <mat-icon>inventory_2</mat-icon>
        <p>No products match your search</p>
      </div>
    }
  </div>
 </div>
